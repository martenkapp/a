<main class="flex-grow-1">
<section class="container py-5"><p class="eyebrow mb-1">Haldusliides</p><h1 class="fw-bold mb-2">Looma lisamine ja muutmine</h1><p class="text-secondary mb-4">Täida looma andmed alloleval vormil.</p><div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><form action="#" method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="animalName">Looma nimi</label><input class="form-control" id="animalName" name="name" required></div><div class="col-md-6"><label class="form-label" for="species">Liik</label><select class="form-select" id="species" name="species" required><option value="" selected disabled>Vali liik</option><option>Koer</option><option>Kass</option><option>Muu</option></select></div><div class="col-md-6"><label class="form-label" for="age">Vanus</label><input class="form-control" id="age" name="age" type="number" min="0" max="50" required></div><div class="col-md-6"><label class="form-label" for="status">Staatus</label><select class="form-select" id="status" name="status" required><option>Kodu otsimas</option><option>Broneeritud</option><option>Leidnud kodu</option></select></div><div class="col-12"><label class="form-label" for="photo">Pildi failinimi</label><input class="form-control" id="photo" name="photo" placeholder="assets/images/loom.png"></div><div class="col-12"><label class="form-label" for="description">Kirjeldus</label><textarea class="form-control" id="description" name="description" rows="5" required></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-success" type="submit">Salvesta</button><a class="btn btn-outline-secondary" href="animals.html">Tühista</a></div></div><p class="form-text mt-3 mb-0">See vorm on staatiline näidis. Andmete salvestamine lisatakse hiljem.</p></form></div></div></section>
